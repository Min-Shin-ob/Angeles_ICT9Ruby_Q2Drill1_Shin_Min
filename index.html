<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Drill 1</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body{
			background: darkorange;
			text-align: center;
			margin: auto;
		}
		.text{
			background: orange;
			margin: 15px;
			border-radius: 10px;
		}
		.img{
			padding: 20px;
		}
		.container{
			background: whitesmoke;
			border: 2px solid;
			border-radius: 17px;
		}
		.container-lg{
			display: flex;
			gap: 30px;
		}
		.box{
			background: whitesmoke;
			text-align: left;
			display: table;
			width: 33%;
			border-radius: 10px;
			border: 2px solid;
		}
		.md-box{
			padding: 15px;
		}
	</style>
</head>
<body>
	<div class="container mt-4" style="text-align: center;">
		<h1>Beginner's guide to Basketball</h1>
	</div>
	<br>
	<div class="img sm-img">
		<img src="bball.jpg" alt="basketball_image">
	</div>
	<br><br>
	<div class="container-lg">
	<div class="box md-box">
		<div class="text">
		<h3>Basic Rules</h3>
		</div>
		<ul>
			<li>No Double Dribbling</li>
			<li>No Foul Playing</li>
			<li>No Kicking</li>
			<li>No Travelling</li>
		</ul>
	</div>
	<div class="box md-box">
		<div class="text">
		<h3>Basketball Equipment</h3>
		</div>
		<ul>
			<li>Basketball</li>
			<li>Court</li>
			<li>Ring</li>
			<li>Net</li>
		</ul>
	</div>
		<div class="box md-box">
		<div class="text">
		<h3>Basic Techniques</h3>
		</div>
		<ul>
			<li>Dribbling</li>
			<li>Shooting</li>
			<li>Defending</li>
			<li>Passing</li>
		</ul>
	</div>
	</div>


</body>
</html>
